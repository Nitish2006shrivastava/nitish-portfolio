<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Nitish Shrivastava</title>
  <meta name="description" content="Contact Nitish Shrivastava for engineering collaborations and opportunities.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header" role="banner">
    <nav class="nav-container" role="navigation" aria-label="Main Navigation">
      <a href="index.html" class="site-logo">NITISH.DEV</a>
      <ul class="nav-list">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
        <li><a href="projects.html" class="nav-link">Projects</a></li>
        <li><a href="contact.html" class="nav-link" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="main-layout" id="main-content">
    <section class="form-container" aria-labelledby="contact-heading">
      <h1 id="contact-heading" class="section-title">Let's Connect</h1>
      
      <div style="margin-bottom: 2rem; color: var(--text-muted);">
        <p><strong>Direct Channels:</strong></p>
        <p>Email: nitish.shrivastava.fake@example.com</p>
        <p>Phone: +91 88XXXXXXxx</p>
      </div>

      <form action="#" method="POST" class="contact-form" novalidate>
        <div class="form-group">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" id="name" name="name" class="form-control" aria-required="true" required>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" aria-required="true" required>
        </div>

        <div class="form-group">
          <label for="subject" class="form-label">Subject</label>
          <input type="text" id="subject" name="subject" class="form-control" aria-required="true" required>
        </div>

        <div class="form-group">
          <label for="message" class="form-label">Message</label>
          <textarea id="message" name="message" class="form-control" aria-required="true" required></textarea>
        </div>

        <div>
          <button type="submit" class="btn btn-primary">Send Message</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="footer-content">
      <p>&copy; 2026 Nitish Shrivastava. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
